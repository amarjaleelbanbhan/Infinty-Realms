version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: infinity_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: infinity_realms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: infinity_redis
    restart: always
    ports:
      - "6379:6379"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: infinity_server
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/infinity_realms?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 3001
      NODE_ENV: production
      AI_PROVIDER: mock
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: infinity_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
