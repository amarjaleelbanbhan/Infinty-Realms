apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinity-realms
  labels:
    app: infinity-realms
spec:
  replicas: 3
  selector:
    matchLabels:
      app: infinity-realms
  template:
    metadata:
      labels:
        app: infinity-realms
    spec:
      containers:
      - name: server
        image: infinity-realms-server:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
